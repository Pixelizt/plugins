clients: []                  # client briefs live in clients/<slug>/ (git-ignored, never published)

skills: [setup, help-me, setup-guide, sharpen-brief, new-client, reskin, add-ui, add-motion, add-module, unslop, diagram, catch-up, harvest, retro]

